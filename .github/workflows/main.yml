name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.13"
      - run: uv sync --group lint --group typing --extra pyqt6
      - run: uv run ruff format --check
      - run: uv run ruff check --output-format=github
      - run: uv run mypy

  test:
    name: Python ${{ matrix.python }} / ${{ matrix.qt }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        qt: [pyqt6]
        include:
          - { python: "3.11", os: ubuntu-latest, qt: pyside6 }
          - { python: "3.14", os: ubuntu-latest, qt: pyside6 }
          - { python: "3.11", os: ubuntu-latest, qt: pyqt5 }
    env:
      UV_NO_SYNC: "1"  # `uv sync` below installs exactly this job's extras; don't let `uv run` add the dev group
      QT_API: ${{ matrix.qt }}
      PYTEST_QT_API: ${{ matrix.qt }}
      COVERAGE_FILE: .coverage.${{ matrix.python }}-${{ matrix.qt }}-${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      # Tests run Qt offscreen (tests/conftest.py), so no X server is needed, but Qt still links
      # against these. Retried because the runners' Ubuntu mirror intermittently stalls.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            sudo timeout 3m apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              && sudo DEBIAN_FRONTEND=noninteractive timeout 5m apt-get install -y --no-install-recommends \
                libdbus-1-3 libegl1 libgl1 libglx-mesa0 libopengl0 libxkbcommon-x11-0 \
                libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
                libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 \
              && exit 0
            echo "apt attempt $attempt failed; retrying in 15s" && sleep 15
          done
          exit 1
      # Windows runners have no OpenGL; this installs Mesa's software renderer, which Qt needs.
      - uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79  # v5.1.0
        if: runner.os == 'Windows'
        with:
          pyvista: false
      - run: uv sync --group test --extra ${{ matrix.qt }} --extra dataframe
      - run: uv run coverage run -m pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-${{ matrix.python }}-${{ matrix.qt }}-${{ matrix.os }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  python-next:
    # Not required: enaml has no release that compiles on 3.15 yet (nucleic/enaml#630). When this
    # turns green, add 3.15 to the test matrix and the classifiers.
    name: Python 3.15 (preview)
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
      QT_API: pyqt6
      PYTEST_QT_API: pyqt6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.15"
      # Tests run Qt offscreen (tests/conftest.py), so no X server is needed, but Qt still links
      # against these. Retried because the runners' Ubuntu mirror intermittently stalls.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            sudo timeout 3m apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              && sudo DEBIAN_FRONTEND=noninteractive timeout 5m apt-get install -y --no-install-recommends \
                libdbus-1-3 libegl1 libgl1 libglx-mesa0 libopengl0 libxkbcommon-x11-0 \
                libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
                libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 \
              && exit 0
            echo "apt attempt $attempt failed; retrying in 15s" && sleep 15
          done
          exit 1
      # Step-level continue-on-error keeps the job (and the PR check) green while 3.15 is blocked;
      # the outcome is reported in the job summary instead.
      - id: py315
        continue-on-error: true
        run: uv sync --group test --extra pyqt6 --extra dataframe && uv run pytest
      - name: Report 3.15 status
        run: |
          if [ "${{ steps.py315.outcome }}" = "success" ]; then
            echo "Python 3.15 now installs and passes: add it to the test matrix and classifiers." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Python 3.15 is still blocked (enaml has no release that builds on it; see nucleic/enaml#630)." >> "$GITHUB_STEP_SUMMARY"
          fi

  coverage:
    name: Coverage
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: uv sync --only-group test
      - run: uv run coverage combine
      - name: Coverage summary
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce minimum coverage
        run: uv run coverage report
      - run: uv run coverage html
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-html
          path: htmlcov

  check:
    name: All checks passed
    if: always()
    needs: [lint, test, python-next, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  publish:
    # PyPI's trusted publisher is registered against this workflow file (main.yml); keep the name.
    name: Publish to PyPI
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
